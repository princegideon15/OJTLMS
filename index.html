header{background:linear-gradient(135deg,#0a3d91,#1657c7 60%,#b8860b);border-bottom:6px solid var(--gold);color:#fff;border-radius:28px;padding:26px;margin-bottom:18px}

.steps{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}

.track{border:2px solid var(--bd);border-radius:20px;padding:16px;text-align:center;cursor:pointer;background:var(--bg);transition:.2s;font:inherit;color:inherit}
.track:hover{transform:translateY(-3px);border-color:var(--pr)}

.btn:hover{transform:scale(1.04)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

.bar{height:12px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px 0 16px}
.bar div{height:100%;background:linear-gradient(90deg,var(--pr),var(--pr2));border-radius:99px;transition:width .3s}
.opt{display:block;width:100%;text-align:left;margin:9px 0;padding:14px 16px;border-radius:16px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;cursor:pointer;transition:.15s}
